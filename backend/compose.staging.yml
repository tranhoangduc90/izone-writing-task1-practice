services:
  writing-task1-practice-api-staging:
    build: .
    container_name: writing-task1-practice-api-staging
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file: /opt/writing-task1-practice-api-staging/.env
    ports:
      - "127.0.0.1:8791:8790"
    networks: [mapping-api-net, n8n-net]
    read_only: true
    tmpfs: [/tmp:size=16m,noexec,nosuid,nodev]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
networks:
  mapping-api-net:
    external: true
  n8n-net:
    external: true
