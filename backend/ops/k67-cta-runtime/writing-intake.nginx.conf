server {
    listen unix:/run/izone-k67-cta-writing/intake.sock;
    server_name ducizone.ddns.net;

    location = /homework-writing67-api/api/internal/classroom/register-cta {
        if ($request_method != POST) { return 405; }
        client_max_body_size 4k;
        proxy_http_version 1.1;
        proxy_set_header Host ducizone.ddns.net;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 24s;
        proxy_pass http://127.0.0.1:15685;
    }

    location / { return 404; }
}
